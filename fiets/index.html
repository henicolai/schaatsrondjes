<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1a14">
<title>Fietsteller</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{--bg:#0f1a14;--card:#16261d;--line:#26402f;--txt:#eef7f0;--dim:#93ad9c;--acc:#7ee08a;--go:#3ddc97;--stop:#ff6b6b;--warn:#ffd166}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 14px);user-select:none}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  h1{font-size:18px;margin:0;font-weight:650}
  h1 a{color:var(--dim);text-decoration:none;font-size:14px;font-weight:500;margin-left:8px}
  #gps{font-size:13px;color:var(--dim);display:flex;align-items:center;gap:6px}
  #gps i{width:9px;height:9px;border-radius:50%;background:#555;display:inline-block}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
  .lbl{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.8px}
  .val{font-variant-numeric:tabular-nums;font-weight:700;line-height:1.05;margin-top:3px;font-size:30px}
  .val small{font-size:14px;color:var(--dim);font-weight:500}
  #speedCard{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .nav{display:none;flex-direction:column;align-items:center;justify-content:center;min-width:66px;line-height:1}
  body.navon .nav{display:flex}
  .nav svg{width:58px;height:58px;display:block}
  .navDist{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px;white-space:nowrap}
  .nav.near svg path,.nav.near svg polygon{stroke:var(--warn);fill:var(--warn)}
  .nav.near .navDist{color:var(--warn)}
  body.navon #speed{font-size:clamp(40px,13.5vw,60px)}
  body.navon #speed small{font-size:15px}
  body.navon #speedCard{gap:4px;padding:10px 10px}
  body.navon #speedCard .side{padding-left:6px;gap:4px}
  body.navon #speedCard .side .lbl{font-size:9px;letter-spacing:.4px}
  body.navon #speedCard .side .val{font-size:18px}
  body.navon #speedCard .side .val small{font-size:10px}
  body.navon #speedCard .nav{min-width:56px}
  body.navon #speedCard .nav svg{width:48px;height:48px}
  #mini .nav svg{width:52px;height:52px}
  #speedCard .side{display:flex;flex-direction:column;gap:8px;text-align:right;padding-left:10px;border-left:1px solid var(--line)}
  #speedCard .side .val{font-size:24px;white-space:nowrap}
  #speedCard .side .val small{font-size:12px}
  #speed{font-size:clamp(52px,19vw,76px);white-space:nowrap;color:var(--acc);font-variant-numeric:tabular-nums;font-weight:800;line-height:1}
  #speed small{font-size:22px;color:var(--dim);font-weight:500}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
  #destBar{display:none;margin-top:8px;align-items:center;gap:10px}
  #destBar.on{display:flex}
  #destBar div{flex:1;min-width:0}
  #destName{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;color:var(--dim)}
  #destInfo{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
  button{font:inherit;border:0;border-radius:14px;padding:15px 10px;font-size:18px;font-weight:650;color:var(--txt);background:var(--line)}
  button:active{transform:scale(.98)}
  .btns{display:grid;grid-template-columns:2fr 1fr 1fr;gap:6px;margin-top:6px}
  #mainBtn{background:var(--go);color:#062b1b}
  #mainBtn.pause{background:var(--warn);color:#3a2a00}
  #stopBtn{background:var(--stop);color:#330808}
  #stopBtn:disabled,#gpxBtn:disabled{opacity:.35}
  .small{font-size:14px;padding:9px 8px;border-radius:10px}
  .tools{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
  .tools button.on{background:var(--acc);color:#0b2410}
  #map{height:62vh;min-height:260px;border-radius:16px;margin-top:8px;border:1px solid var(--line);background:#1c2a22}
  #map.hide{display:none}
  body:not(.alt) .altc{display:none}
  .tools button#headBtn.on,#mini button#head2.on{background:var(--acc);color:#0b2410}
  .tools button#altBtn.on{background:var(--acc);color:#0b2410}
  #mapWrap{position:relative}
  #mini{display:none}
  body.big #mapWrap{position:fixed;inset:0;z-index:1500;background:var(--bg)}
  body.big #map{position:absolute !important;left:0;right:0;bottom:0;top:var(--barH,0px);height:auto;min-height:0;border-radius:0;margin:0;border:0}
  body.big #mini{display:flex;position:absolute;left:8px;right:8px;top:calc(env(safe-area-inset-top) + 8px);z-index:1600;gap:6px;align-items:center;
     background:rgba(15,26,20,.88);border:1px solid var(--line);border-radius:14px;padding:6px 6px 6px 12px}
  body.big #mini{flex-wrap:wrap;padding:8px 10px}
  #mini button{flex:1}
  #miniTxt{display:flex;align-items:center;gap:6px}
  #miniTxt .mt{flex:1;min-width:0;overflow:hidden}
  #miniTxt{flex:1 1 100%;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;line-height:1.1}
  #miniV{font-size:44px;color:var(--acc);font-weight:800}
  #miniTxt small{font-size:15px;color:var(--dim);font-weight:500}
  #miniSub{font-size:20px;margin:2px 0 4px}
  #mini button{padding:14px 14px;font-size:20px;border-radius:12px}
  #mini button.on{background:var(--acc);color:#0b2410}
  body.big #lock{z-index:2000}
  .search{display:flex;gap:5px;margin-top:6px}
  .search input{flex:1;min-width:0;font:inherit;font-size:16px;background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:11px;padding:10px}
  #results{list-style:none;margin:6px 0 0;padding:0}
  #results li{padding:10px 8px;border-bottom:1px solid var(--line);font-size:14px}
  #msg{min-height:18px;font-size:13px;color:var(--dim);margin-top:8px;text-align:center}
  #lock{position:fixed;inset:0;background:rgba(5,12,8,.5);display:none;align-items:flex-end;justify-content:center;
        padding-bottom:calc(env(safe-area-inset-bottom) + 40px);z-index:2000;touch-action:none}
  #lock.on{display:flex}
  #unlock{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:40px;padding:18px 28px;font-size:16px}
  #unlock b{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(126,224,138,.25)}
  .leaflet-container{font:inherit}
  .me{pointer-events:none}
  .me b{position:absolute;left:11px;top:11px;width:18px;height:18px;border-radius:50%;background:#ff1f1f;border:3px solid #fff;
        box-shadow:0 0 6px rgba(0,0,0,.5);box-sizing:border-box;animation:blink 1s steps(1) infinite}
  .me i{position:absolute;left:0;top:0;width:40px;height:40px;border-radius:50%;background:rgba(255,31,31,.45);animation:pulse 1.5s ease-out infinite}
  @keyframes blink{50%{background:#fff;border-color:#ff1f1f}}
  @keyframes pulse{from{transform:scale(.3);opacity:.9}to{transform:scale(1.2);opacity:0}}
  .kn span{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:#fff;
     border:3px solid #138a36;color:#111;font-weight:800;font-size:15px;box-shadow:0 1px 4px rgba(0,0,0,.45);box-sizing:border-box}
  .ants{animation:ants 1s linear infinite}
  @keyframes ants{to{stroke-dashoffset:-20}}
</style>
</head>
<body>
<header>
  <h1>🚲 Fietsteller <a href="../">⛸️ schaatsen</a></h1>
  <div id="gps"><i></i><span>gps uit</span></div>
</header>

<div class="card" id="speedCard">
  <div><div class="lbl">Snelheid</div><div id="speed">0,0<small> km/u</small></div></div>
  <div class="nav" id="nav"><div id="navArrow"></div><div class="navDist" id="navDist"></div></div>
  <div class="side">
    <div><div class="lbl">Gemiddeld</div><div class="val" id="avg">–<small> km/u</small></div></div>
    <div><div class="lbl">Maximum</div><div class="val" id="max">–<small> km/u</small></div></div>
  </div>
</div>
<div class="grid">
  <div class="card"><div class="lbl">Tijd</div><div class="val" id="time">0:00:00</div></div>
  <div class="card"><div class="lbl">Afstand</div><div class="val" id="dist">0,00<small> km</small></div></div>
  <div class="card altc"><div class="lbl">Hoogte</div><div class="val" id="alt">–<small> m</small></div></div>
  <div class="card altc"><div class="lbl">Gestegen</div><div class="val" id="climb">0<small> m</small></div></div>
</div>
<div class="card" id="destBar">
  <div><div id="destName"></div><div id="destInfo">–</div></div>
  <button class="small" id="destClear">✕</button>
</div>

<div class="btns">
  <button id="mainBtn">Start</button>
  <button id="stopBtn" disabled>Stop</button>
  <button id="lockBtn">🔒</button>
</div>

<div class="tools">
  <button class="small" id="ovBtn">🗺️ Fietsroutes</button>
  <button class="small on" id="followBtn">◎ Volgen</button>
  <button class="small" id="headBtn">🧭 Rijrichting</button>
  <button class="small" id="bigBtn">⤢ Grote kaart</button>
  <button class="small" id="mapBtn">Kaart verbergen</button>
  <button class="small" id="altBtn">⛰️ Hoogte</button>
  <button class="small" id="gpxBtn" disabled>⬇ GPX</button>
  <button class="small" id="newBtn">Nieuwe rit</button>
</div>

<form class="search" id="searchForm">
  <input id="q" type="search" placeholder="📍 Bestemming of knooppunten (bv. 23 45 12)" autocomplete="off">
  <button class="small" type="submit">Zoek</button>
</form>
<ul id="results"></ul>
<div id="mapWrap"><div id="map"></div>
  <div id="mini"><div id="miniTxt"><div class="mt"><b id="miniV">0,0</b><small> km/u</small><div id="miniSub">0,00 km</div></div>
    <div class="nav" id="miniNav"><div id="miniArrow"></div><div class="navDist" id="miniNavDist"></div></div></div>
    <button class="small" id="ovBtn2">🗺️</button><button class="small" id="follow2">◎</button><button class="small" id="head2">🧭</button>
    <button class="small" id="miniMain">▶</button><button class="small" id="bigClose">✕</button></div>
</div>

<div id="msg"></div>

<div id="lock"><button id="unlock"><b></b>Houd ingedrukt om te ontgrendelen</button></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="leaflet-rotate.js"></script>
<script>
const $ = id => document.getElementById(id);
const KEY = 'fietsteller-v1', TAG = 'fietsteller';
const MAXACC = 30, MOVING = 0.8;            // m/s ≈ 3 km/u: daaronder sta je stil

let S = Object.assign({status:'idle', elapsed:0, runSince:null, dist:0, maxV:0, moving:0, climb:0,
  track:[], dest:null, overlay:true, mapHidden:false, showAlt:false, headUp:true}, load() || {});
let geoId = null, wake = null, last = null, lastT = null, curV = 0, lastMoveAt = 0, pos = null, lastSave = 0, lastNotify = 0;

function save(force){ if(!force && Date.now() - lastSave < 5000) return; lastSave = Date.now();
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)); }catch(e){ return null; } }
function msg(t){ $('msg').textContent = t || ''; }
const nl = (x, d=1) => x.toFixed(d).replace('.', ',');
function hms(ms){ const s = Math.floor(ms/1000); return `${Math.floor(s/3600)}:${String(Math.floor(s%3600/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; }
function elapsed(){ return S.elapsed + (S.status === 'run' && S.runSince ? Date.now() - S.runSince : 0); }
function avgKmh(){ return S.moving > 5000 ? S.dist / (S.moving/1000) * 3.6 : null; }
function dist(a, b){ const R=6371000, r=Math.PI/180, dLat=(b[0]-a[0])*r, dLon=(b[1]-a[1])*r;
  const h = Math.sin(dLat/2)**2 + Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dLon/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }

/* ---------- Kaart ---------- */
const map = L.map('map', {zoomControl:false, attributionControl:true, rotate:true, rotateControl:false, touchRotate:false, shiftKeyRotate:false, bearing:0}).setView([52.38, 4.64], 13);
const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19,
  attribution:'© OpenStreetMap'}).addTo(map);
const cyclosm = L.tileLayer('https://{s}.tile-cyclosm.openstreetmap.fr/cyclosm/{z}/{x}/{y}.png', {maxZoom:20, subdomains:'abc',
  attribution:'© OpenStreetMap · fietskaart CyclOSM'});
const overlay = L.tileLayer('https://tile.waymarkedtrails.org/cycling/{z}/{x}/{y}.png', {maxZoom:18, opacity:.6,
  attribution:'LF-routes © waymarkedtrails.org'});
const routeCasing = L.polyline([], {color:'#ffffff', weight:12, opacity:.95, interactive:false}).addTo(map);
const routeLine = L.polyline([], {color:'#e3001b', weight:7, opacity:1, interactive:false}).addTo(map);
const routeAnts = L.polyline([], {color:'#ffffff', weight:3, opacity:1, dashArray:'4 16', className:'ants', interactive:false}).addTo(map);
const trackLine = L.polyline([], {color:'#7b2fd6', weight:5, opacity:.9}).addTo(map);
const me = L.marker([0,0], {icon: L.divIcon({className:'me', html:'<i></i><b></b>', iconSize:[40,40], iconAnchor:[20,20]}), zIndexOffset:1000, interactive:false});
let destMarker = null, follow = true; const viaLayer = L.layerGroup().addTo(map);
let followTimer = null;
map.on('dragstart', () => { setFollow(false); resumeFollow(15000); });
function resumeFollow(ms){ clearTimeout(followTimer); followTimer = setTimeout(() => { if(S.status === 'run' || document.body.classList.contains('big')) setFollow(true); }, ms); }
function setFollow(f){ follow = f; $('followBtn').classList.toggle('on', f); $('follow2').classList.toggle('on', f); if(typeof applyBearing === 'function') applyBearing(); if(f && pos) map.setView(pos, Math.max(map.getZoom(), 15)); }
function setOverlay(on){ S.overlay = on;
  if(on){ map.removeLayer(osm); cyclosm.addTo(map); overlay.addTo(map); }
  else { map.removeLayer(cyclosm); map.removeLayer(overlay); osm.addTo(map); }
  [$('ovBtn'), $('ovBtn2')].forEach(b => { b.classList.toggle('on', on); });
  $('ovBtn').textContent = on ? '🗺️ Fietskaart aan' : '🗺️ Fietskaart uit'; save(true); if(typeof knRefresh === 'function') knRefresh(); }
function setBig(b){ document.body.classList.toggle('big', b); if(b){ setMapHidden(false); setFollow(true); } setTimeout(fitMap, 80); }
function setMapHidden(h){ S.mapHidden = h; $('map').classList.toggle('hide', h); $('mapBtn').textContent = h ? 'Kaart tonen' : 'Kaart verbergen';
  if(!h) setTimeout(fitMap, 50); save(true); }
function drawTrack(){ trackLine.setLatLngs(S.track.map(seg => seg.map(p => [p[0], p[1]]))); }

/* ---------- Bestemming ---------- */
$('searchForm').onsubmit = async e => {
  e.preventDefault(); const q = $('q').value.trim(); if(!q) return;
  $('results').innerHTML = '';
  const nums = q.replace(/knooppunt(en)?|kp/gi, ' ').trim().split(/[\s,\-–>]+/).filter(Boolean);
  if(nums.length && nums.every(n => /^\d{1,3}$/.test(n))) return knoop(nums);
  msg('Zoeken…');
  try{
    const near = pos ? `&viewbox=${pos[1]-.5},${pos[0]+.5},${pos[1]+.5},${pos[0]-.5}` : '';
    const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=6&accept-language=nl${near}&q=${encodeURIComponent(q)}`);
    const list = await r.json();
    if(!list.length){ msg('Niets gevonden.'); return; }
    msg('');
    $('results').innerHTML = list.map((x,i) => `<li data-i="${i}">${x.display_name}</li>`).join('');
    $('results').querySelectorAll('li').forEach(li => li.onclick = () => {
      const x = list[+li.dataset.i]; $('results').innerHTML = ''; $('q').value = '';
      setDest(x.display_name.split(',').slice(0,2).join(','), +x.lat, +x.lon);
    });
  }catch(err){ msg('Zoeken mislukt — geen internet?'); }
};
/* Knooppunten (fietsknooppuntennetwerk) via OpenStreetMap/Overpass */
async function overpass(qs){
  const servers = ['https://overpass-api.de/api/interpreter', 'https://maps.mail.ru/osm/tools/overpass/api/interpreter',
                   'https://overpass.kumi.systems/api/interpreter', 'https://overpass.private.coffee/api/interpreter'];
  const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 25000);
  try{
    return await Promise.any(servers.map(u => fetch(u, {method:'POST', body:'data=' + encodeURIComponent(qs), signal:ctl.signal})
      .then(r => { if(!r.ok) throw 0; return r.json(); }).then(j => { if(!j.elements) throw 0; return j.elements; })));
  } finally { ctl.abort(); clearTimeout(tm); }
}
/* Knooppuntbordjes op de kaart (vanaf zoom 13, als de fietskaart aan staat) */
const knLayer = L.layerGroup(), knIds = new Set(), knLoaded = [], knPts = []; let knTimer = null, knBusy = false, knFails = 0;
function knVisible(){ return S.overlay && map.getZoom() >= 13; }
function knRefresh(){
  if(!knVisible()){ map.removeLayer(knLayer); return; }
  knLayer.addTo(map);
  clearTimeout(knTimer); knTimer = setTimeout(knLoad, 400);
}
async function knLoad(){
  if(knBusy || !knVisible()) return;
  const b = map.getBounds();
  if(knLoaded.some(x => x.contains(b))) return;
  const big = b.pad(0.5); knBusy = true;
  try{
    const els = await overpass(`[out:json][timeout:20];node["rcn_ref"](${big.getSouth()},${big.getWest()},${big.getNorth()},${big.getEast()});out;`);
    knLoaded.push(big); knFails = 0;
    els.forEach(e => {
      if(knIds.has(e.id) || !/^\d{1,3}$/.test(e.tags.rcn_ref)) return; knIds.add(e.id);
      const ref = e.tags.rcn_ref;
      if(knPts.some(k => k[0] === ref && dist([k[1],k[2]], [e.lat,e.lon]) < 700)) return;   // dubbele punten van hetzelfde knooppunt
      knPts.push([ref, e.lat, e.lon]);
      L.marker([e.lat, e.lon], {icon: L.divIcon({className:'kn', html:`<span>${ref}</span>`, iconSize:[32,32], iconAnchor:[16,16]}), zIndexOffset:500})
        .on('click', () => knPopup(ref, e.lat, e.lon)).addTo(knLayer);
    });
  }catch(err){ knFails++; if(knFails < 6) setTimeout(knLoad, 3000 * knFails); }   // server bezet: later opnieuw
  finally { knBusy = false; }
}
function knPopup(ref, lat, lon){
  const btn = 'font:inherit;font-weight:650;border:0;border-radius:10px;padding:10px 12px;margin:3px 0;width:100%;';
  L.popup({offset:[0,-10]}).setLatLng([lat, lon]).setContent(
    `<div style="font-weight:700;font-size:16px;margin-bottom:6px">Knooppunt ${ref}</div>` +
    `<button id="knGo" style="${btn}background:#7ee08a;color:#0b2410">📍 Hierheen fietsen</button>` +
    (S.dest ? `<button id="knAdd" style="${btn}background:#e3001b;color:#fff">➕ Aan route toevoegen</button>` : '')).openOn(map);
  setTimeout(() => {
    const g = document.getElementById('knGo'), a = document.getElementById('knAdd');
    if(g) g.onclick = () => { map.closePopup(); S.dest = {name:'Knooppunt ' + ref, lat, lon, via:[], route:null, cum:null}; save(true); showDest(); planRoute(); };
    if(a) a.onclick = () => { map.closePopup(); const d = S.dest; d.via = (d.via || []).concat([[d.lat, d.lon]]);
      const nm = d.name.startsWith('Knooppunt') ? d.name + ' → ' + ref : d.name + ' → knooppunt ' + ref;
      Object.assign(d, {name:nm, lat, lon, route:null, cum:null}); save(true); showDest(); planRoute(); };
  }, 0);
}
map.on('moveend zoomend', knRefresh);
async function knoop(nums){
  const c = pos || [map.getCenter().lat, map.getCenter().lng];
  msg('Knooppunten zoeken…');
  try{
    const parts = [...new Set(nums)].map(n => `node["rcn_ref"="${n}"](around:30000,${c[0]},${c[1]});`).join('');
    const qs = `[out:json][timeout:20];(${parts});out;`;
    const els = await overpass(qs);
    let prev = c; const pts = [];
    for(const n of nums){
      const cands = els.filter(e => e.tags && e.tags.rcn_ref === n);
      if(!cands.length){ msg(`Knooppunt ${n} niet gevonden binnen 30 km.`); return; }
      cands.sort((a,b) => dist(prev,[a.lat,a.lon]) - dist(prev,[b.lat,b.lon]));
      prev = [cands[0].lat, cands[0].lon]; pts.push(prev);
    }
    $('q').value = '';
    const end = pts.pop();
    S.dest = {name:'Knooppunt ' + nums.join(' → '), lat:end[0], lon:end[1], via:pts, route:null, cum:null};
    save(true); showDest(true); msg('');
    if(pos) await planRoute(); else msg('Knooppunten gevonden — route volgt zodra er gps is.');
  }catch(e){ msg('Knooppunten zoeken mislukt — geen internet? Probeer het zo nog eens.'); }
}
map.on('contextmenu', e => {                       // lang drukken op de kaart
  L.popup().setLatLng(e.latlng).setContent('<button id="goHere" style="font:inherit;font-weight:650;border:0;border-radius:10px;padding:10px 14px;background:#7ee08a;color:#0b2410">📍 Hierheen fietsen</button>').openOn(map);
  setTimeout(() => { const b = document.getElementById('goHere'); if(b) b.onclick = () => { map.closePopup(); setDest('Gekozen punt op de kaart', e.latlng.lat, e.latlng.lng); }; }, 0);
});
async function setDest(name, lat, lon){
  S.dest = {name, lat, lon, via:[], route:null, cum:null}; save(true); showDest();
  if(!pos){ msg('Bestemming gezet — route volgt zodra er gps is.'); return; }
  await planRoute();
}
let replanning = false, offCount = 0, lastOff = 0;
async function planRoute(reroute){
  if(!S.dest || !pos || replanning) return;
  replanning = true;
  msg(reroute ? 'Van de route af — nieuwe route berekenen…' : 'Fietsroute berekenen…');
  try{
    const u = `https://brouter.de/brouter?lonlats=${[pos, ...(S.dest.via||[]), [S.dest.lat, S.dest.lon]].map(p => p[1]+','+p[0]).join('|')}&profile=trekking&alternativeidx=0&format=geojson`;
    const g = await (await fetch(u)).json();
    const route = g.features[0].geometry.coordinates.map(c => [c[1], c[0]]);
    const cum = [0]; for(let i=1;i<route.length;i++) cum.push(cum[i-1] + dist(route[i-1], route[i]));
    Object.assign(S.dest, {route, cum, turns: calcTurns(route, cum)}); turnWarned = -1; save(true); msg(reroute ? 'Route herberekend.' : '');
    if(reroute){ if(navigator.vibrate) navigator.vibrate([150, 100, 150]); notify(true); }
  }catch(e){ if(!reroute){ S.dest.route = null; msg('Geen route gevonden — ik toon de afstand hemelsbreed.'); } else msg('Herberekenen mislukt — probeer het zo opnieuw.'); }
  finally { replanning = false; offCount = 0; }
  showDest(!reroute);
}
function segDist(p, a, b){                       // afstand punt–lijnstuk in meters (+ positie t op het stuk)
  const kx = Math.cos(p[0]*Math.PI/180) * 111320, ky = 110540;
  const ax = (a[1]-p[1])*kx, ay = (a[0]-p[0])*ky, dx = (b[1]-a[1])*kx, dy = (b[0]-a[0])*ky;
  const L = dx*dx + dy*dy; let t = L ? -(ax*dx + ay*dy) / L : 0; t = Math.max(0, Math.min(1, t));
  return [Math.hypot(ax + t*dx, ay + t*dy), t];
}
function remaining(){
  if(!S.dest || !pos) return null;
  const d = S.dest;
  if(!d.route) return dist(pos, [d.lat, d.lon]);
  let bi = 0, bd = Infinity, bt = 0;
  for(let i=0;i<d.route.length-1;i++){ const [x, t] = segDist(pos, d.route[i], d.route[i+1]); if(x < bd){ bd = x; bi = i; bt = t; } }
  if(d.route.length < 2) bd = dist(pos, d.route[0] || [d.lat, d.lon]);
  lastOff = bd;
  const done = d.cum[bi] + bt * ((d.cum[bi+1] ?? d.cum[bi]) - d.cum[bi]);
  lastDone = done;
  return Math.max(0, d.cum.at(-1) - done) + bd;
}
/* ---------- Afslagpijlen ---------- */
let lastDone = 0, turnWarned = -1;
function calcTurns(R, C){
  const out = [], n = R.length;
  for(let i=1;i<n-1;i++){
    let j = i; while(j > 0 && C[i]-C[j] < 15) j--;
    let k = i; while(k < n-1 && C[k]-C[i] < 15) k++;
    if(j === i || k === i) continue;
    const a = ((bearing(R[i], R[k]) - bearing(R[j], R[i]) + 540) % 360) - 180;   // + = rechts
    if(Math.abs(a) < 35) continue;
    const last = out.at(-1);
    if(last && C[i] - last.at < 25){ if(Math.abs(a) > Math.abs(last.ang)) { last.at = C[i]; last.ang = a; } }
    else out.push({at:C[i], ang:a});
  }
  return out;
}
function turnName(a){ const r = a > 0 ? 'rechts' : 'links', A = Math.abs(a);
  return A < 35 ? 'Rechtdoor' : A < 60 ? 'Flauw ' + r : A < 120 ? (a > 0 ? 'Rechtsaf' : 'Linksaf') : A < 160 ? 'Scherp ' + r : 'Keren'; }
function arrowSvg(a){
  const A = Math.abs(a);
  if(A >= 160){                                   // keren
    const m = a < 0 ? -1 : 1, x1 = 32 + 10*m, x2 = 32 - 10*m;
    return `<svg viewBox="0 0 64 64"><path d="M${x1} 58 L${x1} 26 A10 10 0 0 0 ${x2} 26 L${x2} 40" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
      <polygon points="${x2-9},38 ${x2+9},38 ${x2},52" fill="#fff" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>`;
  }
  const r = (A < 35 ? 0 : a) * Math.PI/180, L = A < 35 ? 30 : 24, cx = 32, cy = A < 35 ? 40 : 34;
  const dx = Math.sin(r), dy = -Math.cos(r), ex = cx + dx*L, ey = cy + dy*L, px = Math.cos(r), py = Math.sin(r);
  const hp = [[ex+dx*8, ey+dy*8], [ex-dx*5+px*9, ey-dy*5+py*9], [ex-dx*5-px*9, ey-dy*5-py*9]].map(p => p.map(v => v.toFixed(1)).join(',')).join(' ');
  const stem = A < 35 ? `M${cx} 60 L${(ex-dx*2).toFixed(1)} ${(ey-dy*2).toFixed(1)}`
                      : `M${cx} 60 L${cx} ${cy} L${(ex-dx*2).toFixed(1)} ${(ey-dy*2).toFixed(1)}`;
  return `<svg viewBox="0 0 64 64"><path d="${stem}" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="${hp}" fill="#fff" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>`;
}
function fmtM(m){ return m < 1000 ? (Math.round(m/10)*10) + ' m' : nl(m/1000, 1) + ' km'; }
function navInfo(){
  const d = S.dest; if(!d || !d.route || !pos) return null;
  if(!d.turns) d.turns = calcTurns(d.route, d.cum);
  remaining();
  const idx = d.turns.findIndex(t => t.at > lastDone + 5);
  if(idx < 0){ const m = d.cum.at(-1) - lastDone; return {idx:-1, ang:0, m, label: m < 40 ? 'Bestemming' : 'Rechtdoor'}; }
  const t = d.turns[idx]; return {idx, ang:t.ang, m: t.at - lastDone, label: turnName(t.ang)};
}
function renderNav(){
  const n = navInfo(); document.body.classList.toggle('navon', !!n);
  if(!n) return;
  const svg = n.label === 'Bestemming' ? '<svg viewBox="0 0 64 64"><text x="32" y="46" font-size="40" text-anchor="middle">🏁</text></svg>' : arrowSvg(n.ang);
  const txt = n.label === 'Bestemming' ? 'aankomst' : fmtM(n.m);
  if($('navArrow').dataset.k !== svg){ $('navArrow').innerHTML = svg; $('miniArrow').innerHTML = svg; $('navArrow').dataset.k = svg; }
  $('navDist').textContent = txt; $('miniNavDist').textContent = txt;
  const near = n.idx >= 0 && n.m < 50;
  $('nav').classList.toggle('near', near); $('miniNav').classList.toggle('near', near);
  if(S.status === 'run' && n.idx >= 0 && n.m < 120 && n.m > 20 && turnWarned !== n.idx){   // ~100 m van tevoren: horloge + trillen
    turnWarned = n.idx; if(navigator.vibrate) navigator.vibrate([80, 60, 80]); notify(true, `${n.label} over ${fmtM(n.m)}`);
  }
}
function showDest(fit){
  const d = S.dest; const was = $('destBar').classList.contains('on'); $('destBar').classList.toggle('on', !!d); if(was !== !!d) setTimeout(fitMap, 30);
  if(destMarker){ map.removeLayer(destMarker); destMarker = null; }
  viaLayer.clearLayers();
  (d && d.via || []).forEach(v => L.circleMarker(v, {radius:7, color:'#fff', weight:2, fillColor:'#2f7cf6', fillOpacity:1}).addTo(viaLayer));
  [routeCasing, routeLine, routeAnts].forEach(l => l.setLatLngs(d && d.route ? d.route : []));
  if(!d) return;
  $('destName').textContent = '→ ' + d.name;
  destMarker = L.marker([d.lat, d.lon]).addTo(map);
  if(fit){ setFollow(false); resumeFollow(8000); map.fitBounds(d.route ? routeLine.getBounds() : L.latLngBounds([pos || [d.lat,d.lon], [d.lat,d.lon]]), {padding:[30,30]}); }
  renderDest();
}
function destText(){
  const rem = remaining(); if(rem == null) return null;
  const v = (avgKmh() || 16) / 3.6;                       // zonder gemiddelde: reken met 16 km/u
  const eta = new Date(Date.now() + rem / v * 1000);
  return {km: nl(rem/1000, rem < 10000 ? 2 : 1), eta: eta.toLocaleTimeString('nl-NL', {hour:'2-digit', minute:'2-digit'})};
}
function renderDest(){ renderNav(); const t = destText(); $('destInfo').textContent = t ? `nog ${t.km} km · ~${t.eta}` : 'wacht op gps…'; }
$('destClear').onclick = () => { S.dest = null; save(true); showDest(); notify(); };

/* ---------- Rijrichting (kaart draait mee) ---------- */
let hd = null, prevH = null;
function bearing(a, b){ const r = Math.PI/180, y = Math.sin((b[1]-a[1])*r)*Math.cos(b[0]*r),
  x = Math.cos(a[0]*r)*Math.sin(b[0]*r) - Math.sin(a[0]*r)*Math.cos(b[0]*r)*Math.cos((b[1]-a[1])*r); return (Math.atan2(y, x)/r + 360) % 360; }
function updHeading(c, here){
  let h = null;
  if(c.heading != null && !isNaN(c.heading) && (c.speed || 0) > 1.5) h = c.heading;
  else if(prevH && dist(prevH, here) >= 8) h = bearing(prevH, here);
  if(!prevH || dist(prevH, here) >= 8) prevH = here;
  if(h == null) return;
  if(hd == null) hd = h; else { const d = ((h - hd + 540) % 360) - 180; hd = (hd + d * 0.4 + 360) % 360; }
  applyBearing();
}
function applyBearing(){ map.setBearing(S.headUp && follow && hd != null ? -hd : 0); }
function setHeadUp(on){ S.headUp = on; [$('headBtn'), $('head2')].forEach(b => b.classList.toggle('on', on));
  $('headBtn').textContent = on ? '🧭 Rijrichting boven' : '🧭 Noord boven'; applyBearing(); save(true); }
/* Kaart precies passend in het scherm, zodat je positie in het midden van wat je ziet staat */
function fitMap(){
  if(document.body.classList.contains('big')){
    $('map').style.height = '';
    document.documentElement.style.setProperty('--barH', ($('mini').offsetHeight + $('mini').offsetTop + 6) + 'px');
  } else if(!S.mapHidden){
    const m = $('map'); m.style.height = Math.max(260, window.innerHeight - m.getBoundingClientRect().top - window.scrollY - 12) + 'px';
  }
  map.invalidateSize({pan:false});
  if(follow && pos) map.setView(pos, map.getZoom(), {animate:false});
}
window.addEventListener('resize', () => setTimeout(fitMap, 100));
/* ---------- Demping snelheid ---------- */
let smoothT = 0, altSm = null, altRef = null;
function smooth(v, t){
  if(v <= MOVING){ smoothT = t; return 0; }                   // stilstaan: meteen 0
  const dt = smoothT ? Math.min((t - smoothT) / 1000, 5) : 5;  // tijd sinds vorige meting
  smoothT = t;
  const k = 1 - Math.exp(-dt / 4);                             // tijdconstante 4 s
  return curV > MOVING ? curV + k * (v - curV) : v;
}
/* ---------- GPS ---------- */
function gpsStatus(text, color){ $('gps').querySelector('span').textContent = text; $('gps').querySelector('i').style.background = color; }
function onFix(p){
  const c = p.coords, t = Date.now(), here = [c.latitude, c.longitude];
  pos = here; me.setLatLng(here); if(!map.hasLayer(me)) me.addTo(map);
  if(c.accuracy <= MAXACC) updHeading(c, here);
  if(follow) map.setView(here, Math.max(map.getZoom(), 16), {animate:false});
  gpsStatus(`± ${Math.round(c.accuracy)} m`, c.accuracy <= 10 ? 'var(--go)' : c.accuracy <= MAXACC ? 'var(--warn)' : 'var(--stop)');
  if(S.dest && S.dest.via && S.dest.via.length && dist(here, S.dest.via[0]) < 60){ S.dest.via.shift(); save(true); showDest(); }  // knooppunt gepasseerd
  if(S.dest && !S.dest.route && !S.dest.triedRoute){ S.dest.triedRoute = true; planRoute(); }
  if(c.accuracy > MAXACC){ render(); return; }

  if(c.altitude != null && (c.altitudeAccuracy == null || c.altitudeAccuracy <= 25)){
    altSm = altSm == null ? c.altitude : altSm + 0.15 * (c.altitude - altSm);   // gedempte hoogte
    if(S.status === 'run'){
      if(altRef == null) altRef = altSm;
      if(altSm - altRef >= 3){ S.climb += altSm - altRef; altRef = altSm; }       // stijging pas tellen boven 3 m ruis
      else if(altSm < altRef) altRef = altSm;
    }
  }
  let v = (c.speed != null && c.speed >= 0) ? c.speed : null;
  if(S.status === 'run'){
    if(last){
      const d = dist(last, here), dt = (t - last[2]) / 1000;
      if(d >= Math.max(3, c.accuracy * 0.5)){
        if(v == null && dt > 0) v = d / dt;
        if(d / Math.max(dt, .5) < 25){                     // sprongen > 90 km/u negeren
          S.dist += d; last = [here[0], here[1], t];
          S.track.at(-1).push([+here[0].toFixed(6), +here[1].toFixed(6), t, altSm == null ? null : Math.round(altSm)]);
          drawTrack();
        }
      }
    } else {
      last = [here[0], here[1], t];
      if(!S.track.length || S.track.at(-1).length) S.track.push([]);
      S.track.at(-1).push([+here[0].toFixed(6), +here[1].toFixed(6), t]);
    }
    if(v != null){ curV = smooth(v, t); if(v > MOVING) lastMoveAt = t; }
    if(lastT && curV > MOVING) S.moving += Math.min(t - lastT, 10000);
    if(v != null && c.accuracy <= 20 && v < 25) S.maxV = Math.max(S.maxV, v * 3.6);
    lastT = t; save();
  } else if(v != null) curV = smooth(v, t);
  if(S.dest && S.dest.route && c.accuracy <= 25){        // afwijking van de route: 3 metingen > 50 m → herberekenen
    remaining();
    offCount = lastOff > Math.max(50, c.accuracy * 2) ? offCount + 1 : 0;
    if(offCount >= 3 && Date.now() - (S.dest.replanAt || 0) > 20000){ S.dest.replanAt = Date.now(); planRoute(true); }
  }
  render();
  if(S.status === 'run' && t - lastNotify > 10000) notify();
}
function startGps(){
  if(geoId != null || !('geolocation' in navigator)) return;
  gpsStatus('zoeken…', 'var(--warn)');
  geoId = navigator.geolocation.watchPosition(onFix, e => {
    gpsStatus('geen gps', 'var(--stop)');
    msg(e.code === 1 ? 'Locatietoegang geweigerd — sta locatie toe in de instellingen.' : 'Geen gps-signaal.');
  }, {enableHighAccuracy:true, maximumAge:0, timeout:20000});
}

/* ---------- Weergave ---------- */
function render(){
  if(Date.now() - lastMoveAt > 5000 && S.status === 'run') curV = 0;
  $('speed').innerHTML = nl(S.status === 'run' ? curV * 3.6 : 0) + '<small> km/u</small>';
  const a = avgKmh();
  $('avg').innerHTML = (a == null ? '–' : nl(a)) + '<small> km/u</small>';
  $('max').innerHTML = (S.maxV ? nl(S.maxV) : '–') + '<small> km/u</small>';
  $('time').textContent = hms(elapsed());
  $('dist').innerHTML = nl(S.dist/1000, 2) + '<small> km</small>';
  $('alt').innerHTML = (altSm == null ? '–' : Math.round(altSm)) + '<small> m</small>';
  $('climb').innerHTML = Math.round(S.climb) + '<small> m</small>';
  const mb = $('mainBtn');
  mb.textContent = S.status === 'run' ? 'Pauze' : S.status === 'idle' ? 'Start' : 'Doorgaan';
  mb.classList.toggle('pause', S.status === 'run');
  $('stopBtn').disabled = !(S.status === 'run' || S.status === 'pause');
  $('gpxBtn').disabled = !S.track.some(s => s.length > 1);
  if(S.dest) renderDest();
  renderMini(); renderNav();
}
function renderMini(){
  const t = destText();
  $('miniV').textContent = nl(S.status === 'run' ? curV*3.6 : 0);
  $('miniSub').textContent = `${nl(S.dist/1000,2)} km · ${hms(elapsed())}` + (t ? ` · nog ${t.km}` : '');
  $('miniMain').textContent = S.status === 'run' ? '⏸' : '▶';
}
setInterval(() => { $('time').textContent = hms(elapsed()); renderMini(); if(S.status === 'run' && Date.now() - lastMoveAt > 5000){ curV = 0; $('speed').innerHTML = '0,0<small> km/u</small>'; } }, 1000);

/* ---------- Melding → Galaxy Watch ---------- */
async function notify(buzz, turnTxt){
  lastNotify = Date.now();
  if(!('Notification' in window) || Notification.permission !== 'granted' || !navigator.serviceWorker) return;
  const reg = await navigator.serviceWorker.ready;
  if(S.status === 'idle'){ (await reg.getNotifications({tag:TAG})).forEach(n => n.close()); return; }
  const a = avgKmh(), dt = destText();
  const head = S.status === 'run' ? `${nl(curV*3.6)} km/u · ${nl(S.dist/1000,2)} km`
             : S.status === 'pause' ? `Pauze · ${nl(S.dist/1000,2)} km` : `Klaar · ${nl(S.dist/1000,2)} km`;
  const nv = S.status === 'run' ? navInfo() : null;
  const navTxt = turnTxt || (nv && nv.idx >= 0 ? `${nv.label} over ${fmtM(nv.m)}` : '');
  let body = (navTxt ? '➜ ' + navTxt + '\n' : '') + `${hms(elapsed())} · gem ${a == null ? '–' : nl(a)} · max ${S.maxV ? nl(S.maxV) : '–'} · ↑${Math.round(S.climb)} m`;
  if(dt) body += ` · nog ${dt.km} km (${dt.eta})`;
  const actions = S.status === 'run' ? [{action:'pause', title:'Pauze'}, {action:'stop', title:'Stop'}]
                : S.status === 'pause' ? [{action:'resume', title:'Doorgaan'}, {action:'stop', title:'Stop'}]
                : [{action:'resume', title:'Doorgaan'}];
  reg.showNotification(head, {body, tag:TAG, renotify:!!buzz, silent:!buzz, requireInteraction:true,
    icon:'icon-192.png', badge:'icon-192.png', actions});
}

/* ---------- Bediening ---------- */
async function keepAwake(){ try{ if('wakeLock' in navigator && S.status === 'run') wake = await navigator.wakeLock.request('screen'); }catch(e){} }
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') keepAwake(); });

function cmd(c){
  if(c === 'start' || c === 'resume'){
    if(S.status === 'run') return;
    S.status = 'run'; S.runSince = Date.now(); last = null; lastT = null; lastMoveAt = 0; smoothT = 0; setFollow(true);
    keepAwake(); startGps();
  } else if(c === 'pause' || c === 'stop'){
    if(S.status !== 'run' && !(c === 'stop' && S.status === 'pause')) return;
    if(S.status === 'run'){ S.elapsed += Date.now() - S.runSince; S.runSince = null; }
    S.status = c === 'stop' ? 'done' : 'pause'; last = null; curV = 0;
    if(c === 'stop'){ try{ wake && wake.release(); }catch(e){} wake = null; }
  }
  save(true); render(); notify(true);
  if(navigator.vibrate) navigator.vibrate(120);
}
$('mainBtn').onclick = async () => {
  if('Notification' in window && Notification.permission === 'default'){ try{ await Notification.requestPermission(); }catch(e){} }
  cmd(S.status === 'run' ? 'pause' : S.status === 'idle' ? 'start' : 'resume');
};
$('stopBtn').onclick = () => cmd('stop');
let newArmed = 0;
$('newBtn').onclick = () => {
  if(S.status !== 'idle' && Date.now() - newArmed > 3000){ newArmed = Date.now(); msg('Tik nogmaals op Nieuwe rit om de huidige rit te wissen.'); return; }
  Object.assign(S, {status:'idle', elapsed:0, runSince:null, dist:0, maxV:0, moving:0, climb:0, track:[]});
  last = null; curV = 0; altRef = null; drawTrack(); save(true); render(); notify(); msg('Klaar voor een nieuwe rit.');
};
$('ovBtn').onclick = () => setOverlay(!S.overlay);
$('followBtn').onclick = () => setFollow(!follow);
$('mapBtn').onclick = () => setMapHidden(!S.mapHidden);
function setAlt(on){ S.showAlt = on; document.body.classList.toggle('alt', on); $('altBtn').classList.toggle('on', on); save(true); setTimeout(fitMap, 30); }
$('headBtn').onclick = () => setHeadUp(!S.headUp);
$('head2').onclick = () => setHeadUp(!S.headUp);
$('altBtn').onclick = () => setAlt(!S.showAlt);
$('bigBtn').onclick = () => setBig(true);
$('bigClose').onclick = () => setBig(false);
$('ovBtn2').onclick = () => setOverlay(!S.overlay);
$('follow2').onclick = () => setFollow(!follow);
$('miniMain').onclick = () => $('mainBtn').onclick();
$('gpxBtn').onclick = () => {
  const segs = S.track.filter(s => s.length > 1).map(s => '<trkseg>' + s.map(p =>
    `<trkpt lat="${p[0]}" lon="${p[1]}">${p[3] != null ? `<ele>${p[3]}</ele>` : ''}<time>${new Date(p[2]).toISOString()}</time></trkpt>`).join('') + '</trkseg>').join('');
  const start = S.track.find(s => s.length)?.[0]?.[2] || Date.now();
  const gpx = `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Fietsteller" xmlns="http://www.topografix.com/GPX/1/1"><trk><name>Fietsrit ${new Date(start).toLocaleString('nl-NL')}</name>${segs}</trk></gpx>`;
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([gpx], {type:'application/gpx+xml'}));
  a.download = `fietsrit-${new Date(start).toISOString().slice(0,10)}.gpx`; a.click();
};

/* Vergrendelen tegen per ongeluk tikken */
$('lockBtn').onclick = () => $('lock').classList.add('on');
(() => {
  const u = $('unlock'), bar = u.querySelector('b'); let t0 = 0, raf = 0;
  const step = () => { const p = Math.min(1, (Date.now() - t0) / 1200); bar.style.width = p*100 + '%';
    if(p >= 1){ $('lock').classList.remove('on'); bar.style.width = 0; return; } raf = requestAnimationFrame(step); };
  u.addEventListener('pointerdown', e => { e.preventDefault(); t0 = Date.now(); raf = requestAnimationFrame(step); });
  ['pointerup','pointerleave','pointercancel'].forEach(ev => u.addEventListener(ev, () => { cancelAnimationFrame(raf); bar.style.width = 0; }));
})();

/* Service worker: offline + knoppen in de melding (horloge) */
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js', {scope:'./'});
  navigator.serviceWorker.addEventListener('message', e => { if(e.data && e.data.type === 'cmd') cmd(e.data.cmd); });

/* Start */
